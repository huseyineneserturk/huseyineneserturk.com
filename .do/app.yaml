# DigitalOcean App Platform — statik site tanımı
# Kullanım:
#   1. Bu repoyu GitHub'a yükle (huseyineneserturk/huseyineneserturk.com)
#   2. DigitalOcean → Apps → Create App → GitHub reposunu seç
#      (ya da: doctl apps create --spec .do/app.yaml)
#   3. Settings → Domains'ten huseyineneserturk.com'u ekle, DNS'i Hostinger'da ayarla
name: huseyineneserturk-com
region: fra # Frankfurt — Türkiye'ye en yakın bölgelerden
static_sites:
  - name: codex
    github:
      repo: huseyineneserturk/huseyineneserturk.com
      branch: main
      deploy_on_push: true # main'e her push'ta otomatik dağıtım
    environment_slug: node-js
    build_command: npm run build
    output_dir: dist
    index_document: index.html
    error_document: 404.html
    catchall_document: 404.html
    routes:
      - path: /
